
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Photo Editing Prompts & Videos | Smart Tech R6</title>
<meta name="description" content="Explore trending AI photo editing images, creative prompts and videos on Smart Tech R6.">
<meta name="robots" content="index, follow">
<meta name="author" content="Smart Tech R6">

<link rel="canonical" href="https://anilbhilwada772-ai.github.io/smart-tech-r6/gallery-detail.html">
<link rel="icon" type="image/png" href="smart-tech-r6-logo.png">
<link rel="stylesheet" href="style.css">

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#f4f7fc;
 color:#172033;
 font-family:Arial,sans-serif;
}

header{
 background:#1769e0;
 color:white;
 padding:18px 5%;
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:12px;
 flex-wrap:wrap;
}

header a{
 color:white;
 text-decoration:none;
}

.container{
 max-width:1000px;
 margin:25px auto;
 padding:15px;
}

/* Main Thumbnail */
.main-thumbnail{
 width:100%;
 display:block;
 max-height:550px;
 object-fit:cover;
 border-radius:14px;
 margin-bottom:22px;
 background:#e2e8f0;
 box-shadow:0 3px 14px #00000012;
}

#postTitle{
 font-size:30px;
 line-height:1.3;
 margin:12px 0;
 color:#172033;
}

#postDescription{
 color:#64748b;
 line-height:1.7;
}

.item-card{
 background:white;
 padding:16px;
 margin:22px 0;
 border-radius:13px;
 box-shadow:0 3px 14px #0000000c;
}

.item-card img,
.item-card video{
 width:100%;
 max-height:650px;
 object-fit:contain;
 border-radius:9px;
 background:#eef2f7;
}

.prompt{
 background:#f1f5f9;
 padding:15px;
 border-radius:9px;
 white-space:pre-wrap;
 overflow-wrap:anywhere;
 line-height:1.6;
}

button{
 background:#1769e0;
 color:white;
 border:0;
 padding:12px 18px;
 border-radius:8px;
 cursor:pointer;
 font-weight:bold;
}

button:hover{
 background:#0d51b5;
}

.copy-status{
 color:#16803c;
 font-size:14px;
 margin-left:10px;
}

.category{
 color:#1769e0;
 font-weight:bold;
}

#message{
 padding:20px;
 background:white;
 border-radius:10px;
}

iframe{
 width:100%;
 aspect-ratio:16/9;
 border:0;
 border-radius:9px;
}

/* Step-by-Step Guide */
.guide-section{
 background:white;
 padding:22px;
 margin:30px 0;
 border-radius:13px;
 box-shadow:0 3px 14px #0000000c;
}

.guide-section h2{
 color:#1769e0;
 margin-top:0;
}

.guide-content{
 white-space:pre-wrap;
 overflow-wrap:anywhere;
 line-height:1.8;
 color:#263449;
 font-size:16px;
}

footer{
 text-align:center;
 padding:25px;
 color:#64748b;
}

@media(max-width:600px){
 .container{
  padding:12px;
  margin:15px auto;
 }

 #postTitle{
  font-size:24px;
 }

 .main-thumbnail{
  max-height:350px;
 }
}
</style>
</head>

<body>

<header>
<strong>Smart Tech R6</strong>
<a href="index.html">← Back to Home</a>
</header>

<main class="container">

<div id="message">Loading post...</div>

<article id="post" hidden>

<!-- Same Homepage Thumbnail -->
<img id="mainThumbnail"
     class="main-thumbnail"
     alt="AI Photo Gallery Thumbnail"
     hidden>

<!-- Title Below Thumbnail -->
<p class="category" id="category"></p>

<h1 id="postTitle"></h1>

<p id="postDescription"></p>

<!-- All Photos, Prompts and Videos -->
<div id="postItems"></div>

<!-- Complete Guide -->
<section id="guideSection" class="guide-section" hidden>
<h2>📖 Complete Guide / Step-by-Step Tutorial</h2>
<div id="guideContent" class="guide-content"></div>
</section>

</article>

</main>

<footer>© Smart Tech R6 | AI Tools & Prompt Gallery</footer>

<script type="module">
import { supabase } from './supabase.js';

const message=document.getElementById('message');
const post=document.getElementById('post');
const postItems=document.getElementById('postItems');

function addText(parent,tag,value,className=''){
 const el=document.createElement(tag);
 el.textContent=value||'';
 if(className)el.className=className;
 parent.appendChild(el);
 return el;
}

// Dynamic SEO helper
function setMeta(attribute,name,content){
 let tag=document.querySelector(`meta[${attribute}="${name}"]`);

 if(!tag){
  tag=document.createElement('meta');
  tag.setAttribute(attribute,name);
  document.head.appendChild(tag);
 }

 tag.setAttribute('content',content);
}

function setCanonical(url){
 let link=document.querySelector('link[rel="canonical"]');

 if(!link){
  link=document.createElement('link');
  link.rel='canonical';
  document.head.appendChild(link);
 }

 link.href=url;
}

function updateSEO(postData,items,postId){
 const title=postData.title||'AI Gallery Post';

 const description=(postData.description||'Explore AI photos, prompts and videos on Smart Tech R6.')
  .replace(/\s+/g,' ')
  .slice(0,155);

 const pageUrl=new URL(location.href);
 pageUrl.search='';
 pageUrl.searchParams.set('id',postId);
 pageUrl.hash='';

 const canonicalUrl=pageUrl.href;

 const firstPhoto=(items||[]).find(item=>
  item.item_type==='photo'&&item.media_url
 );

 const shareImage=postData.thumbnail_url||
  (firstPhoto?firstPhoto.media_url:
  'https://anilbhilwada772-ai.github.io/smart-tech-r6/smart-tech-r6-logo.png');

 document.title=title+' | Smart Tech R6';

 setMeta('name','description',description);
 setMeta('name','robots','index, follow');

 setCanonical(canonicalUrl);

 setMeta('property','og:type','article');
 setMeta('property','og:site_name','Smart Tech R6');
 setMeta('property','og:title',title+' | Smart Tech R6');
 setMeta('property','og:description',description);
 setMeta('property','og:url',canonicalUrl);
 setMeta('property','og:image',shareImage);
 setMeta('property','og:image:alt',title);

 setMeta('name','twitter:card','summary_large_image');
 setMeta('name','twitter:title',title+' | Smart Tech R6');
 setMeta('name','twitter:description',description);
 setMeta('name','twitter:image',shareImage);
}

function youtubeId(url){
 try{
  const u=new URL(url);

  if(u.hostname==='youtu.be')return u.pathname.slice(1);

  if(['youtube.com','www.youtube.com','m.youtube.com'].includes(u.hostname)){
   if(u.pathname==='/watch')return u.searchParams.get('v');

   const match=u.pathname.match(/^\/(embed|shorts)\/([^/?]+)/);
   return match?match[2]:null;
  }
 }catch{}

 return null;
}

async function copyPrompt(text,status){
 try{
  await navigator.clipboard.writeText(text);
  status.textContent='Copied successfully!';
 }catch{
  status.textContent='Copy failed. Please select and copy the prompt.';
 }
}

function renderItem(item){
 const card=document.createElement('section');
 card.className='item-card';

 if(item.item_type==='photo'){
  const img=document.createElement('img');
  img.src=item.media_url;
  img.alt='AI Photo Editing - Smart Tech R6';
  img.loading='lazy';
  card.appendChild(img);

  addText(card,'h3','AI Photo Prompt');

  if(item.prompt){
   addText(card,'div',item.prompt,'prompt');

   const row=document.createElement('div');
   row.style.marginTop='12px';
   row.style.display='flex';
   row.style.flexWrap='wrap';
   row.style.gap='10px';

   const btn=document.createElement('button');
   btn.textContent='📋 Copy Prompt';

   const status=document.createElement('span');
   status.className='copy-status';

   btn.onclick=()=>copyPrompt(item.prompt,status);

   const chatBtn=document.createElement('button');

   chatBtn.innerHTML=`
    <img src="chatgpt-logo.png"
         alt="ChatGPT Logo"
         style="
          width:28px;
          height:28px;
          object-fit:contain;
          display:block;
          flex-shrink:0;
         ">
    <span>ChatGPT</span>
   `;

   chatBtn.style.background='#10a37f';
   chatBtn.style.color='#ffffff';
   chatBtn.style.border='none';
   chatBtn.style.padding='10px 15px';
   chatBtn.style.borderRadius='6px';
   chatBtn.style.cursor='pointer';
   chatBtn.style.display='inline-flex';
   chatBtn.style.alignItems='center';
   chatBtn.style.justifyContent='center';
   chatBtn.style.gap='8px';
   chatBtn.style.fontWeight='bold';
   chatBtn.style.overflow='visible';

   chatBtn.onclick=()=>{
    const chatUrl='https://chatgpt.com/?q='+encodeURIComponent(item.prompt);
    window.open(chatUrl,'_blank','noopener');
   };

   row.append(btn,chatBtn,status);
   card.appendChild(row);
  }
 }
 else if(item.item_type==='video_upload'){
  const video=document.createElement('video');
  video.src=item.media_url;
  video.controls=true;
  video.preload='metadata';
  card.appendChild(video);
 }
 else if(item.item_type==='youtube'){
  const id=youtubeId(item.media_url);

  if(id){
   const frame=document.createElement('iframe');
   frame.src='https://www.youtube.com/embed/'+encodeURIComponent(id);
   frame.title='YouTube Video';
   frame.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
   frame.allowFullscreen=true;
   card.appendChild(frame);
  }else{
   const link=document.createElement('a');
   link.href=item.media_url;
   link.textContent='Watch on YouTube';
   link.target='_blank';
   link.rel='noopener noreferrer';
   card.appendChild(link);
  }
 }

 if(item.description){
  addText(card,'p',item.description);
 }

 postItems.appendChild(card);
}

async function loadPost(){
 const id=new URLSearchParams(location.search).get('id');

 if(!id){
  message.textContent='Post ID not found.';
  return;
 }

 try{
  const {data:postData,error:postError}=await supabase
   .from('gallery_posts')
   .select('id,title,category,description,thumbnail_url,guide_content')
   .eq('id',id)
   .eq('is_published',true)
   .maybeSingle();

  if(postError)throw postError;

  if(!postData){
   message.textContent='Post not found or not published.';
   return;
  }

  const {data:items,error:itemError}=await supabase
   .from('gallery_items')
   .select('id,item_type,media_url,prompt,description,sort_order')
   .eq('post_id',id)
   .order('sort_order',{ascending:true});

  if(itemError)throw itemError;

  updateSEO(postData,items,id);

  // Show the same thumbnail used on the homepage
  const thumbnail=document.getElementById('mainThumbnail');

  if(postData.thumbnail_url){
   thumbnail.src=postData.thumbnail_url;
   thumbnail.alt=postData.title||'AI Gallery Thumbnail';
   thumbnail.hidden=false;
  }else{
   thumbnail.hidden=true;
   thumbnail.removeAttribute('src');
  }

  // Show title and category below thumbnail
  document.getElementById('postTitle').textContent=postData.title||'';
  document.getElementById('category').textContent=postData.category||'AI Gallery';
  document.getElementById('postDescription').textContent=postData.description||'';

  postItems.innerHTML='';

  (items||[]).forEach(renderItem);

  if(!items||items.length===0){
   addText(postItems,'p','No photos or videos in this post yet.');
  }

  // Display Complete Guide at the bottom
  const guideSection=document.getElementById('guideSection');
  const guideContent=document.getElementById('guideContent');

  if(postData.guide_content&&postData.guide_content.trim()){
   guideContent.textContent=postData.guide_content;
   guideSection.hidden=false;
  }else{
   guideContent.textContent='';
   guideSection.hidden=true;
  }

  message.hidden=true;
  post.hidden=false;

 }catch(error){
  message.textContent='Error loading post: '+error.message;
 }
}

loadPost();
</script>

</body>
</html>
