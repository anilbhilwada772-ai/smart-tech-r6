
<section id="publicGallery" class="public-gallery">

    <div class="gallery-heading">
        <h2>Latest AI Photo Prompts</h2>
        <p>Explore trending AI photos and their prompts.</p>
    </div>

    <div id="galleryPosts" class="gallery-posts">
        <p>Loading gallery posts...</p>
    </div>

    <div id="galleryPagination" class="gallery-pagination"></div>

</section>

<script type="module">
import { supabase } from './supabase.js';

const gallery = document.getElementById('galleryPosts');
const pagination = document.getElementById('galleryPagination');

const PHOTOS_PER_PAGE = 6;
let allPosts = [];
let currentPage = Math.max(
    1,
    parseInt(new URLSearchParams(location.search).get('page')) || 1
);

function updateURL() {
    const url = new URL(location.href);

    if (currentPage === 1) {
        url.searchParams.delete('page');
    } else {
        url.searchParams.set('page', currentPage);
    }

    history.pushState({}, '', url);
}

function renderGallery() {
    const totalPages = Math.ceil(allPosts.length / PHOTOS_PER_PAGE);
    currentPage = Math.min(currentPage, Math.max(1, totalPages));

    gallery.innerHTML = '';

    if (!allPosts.length) {
        gallery.textContent = 'No published posts available yet.';
        pagination.innerHTML = '';
        return;
    }

    const start = (currentPage - 1) * PHOTOS_PER_PAGE;
    const posts = allPosts.slice(start, start + PHOTOS_PER_PAGE);

    posts.forEach(post => {
        const card = document.createElement('article');
        card.className = 'gallery-card';

        const link = document.createElement('a');
        link.href = 'gallery-detail.html?id=' + encodeURIComponent(post.id);
        link.style.cssText = 'color:inherit;text-decoration:none;display:block';

        const img = document.createElement('img');
        img.src = post.thumbnail_url;
        img.alt = post.title || 'AI Photo';
        img.loading = 'lazy';

        const title = document.createElement('h3');
        title.textContent = post.title || 'AI Photo';

        const category = document.createElement('p');
        category.textContent = post.category || 'AI Gallery';

        link.append(img, title, category);
        card.appendChild(link);
        gallery.appendChild(card);
    });

    renderPagination(totalPages);
}

function renderPagination(totalPages) {
    pagination.innerHTML = '';

    if (totalPages <= 1) return;

    const previous = document.createElement('button');
    previous.textContent = '← Previous';
    previous.disabled = currentPage === 1;

    previous.onclick = () => {
        if (currentPage > 1) {
            currentPage--;
            updateURL();
            renderGallery();
            document.getElementById('publicGallery')
                .scrollIntoView({ behavior: 'smooth' });
        }
    };

    const next = document.createElement('button');
    next.textContent = 'Next →';
    next.disabled = currentPage === totalPages;

    next.onclick = () => {
        if (currentPage < totalPages) {
            currentPage++;
            updateURL();
            renderGallery();
            document.getElementById('publicGallery')
                .scrollIntoView({ behavior: 'smooth' });
        }
    };

    pagination.append(previous, next);
}

async function loadGalleryPosts() {
    try {
        gallery.textContent = 'Loading gallery posts...';

        const { data, error } = await supabase
            .from('gallery_posts')
            .select('id,title,category,description,thumbnail_url,created_at')
            .eq('is_published', true)
            .order('created_at', { ascending: false });

        if (error) throw error;

        allPosts = data || [];
        renderGallery();

    } catch (error) {
        gallery.textContent = 'Gallery loading failed: ' + error.message;
        console.error(error);
    }
}

window.addEventListener('popstate', () => {
    currentPage = Math.max(
        1,
        parseInt(new URLSearchParams(location.search).get('page')) || 1
    );
    renderGallery();
});

loadGalleryPosts();
</script>
