
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Photo Prompt - Smart Tech R6</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .detail-container {
      max-width: 850px;
      margin: 30px auto;
      padding: 20px;
    }
    .detail-container img {
      width: 100%;
      max-height: 550px;
      object-fit: contain;
      border-radius: 12px;
    }
    .prompt-box {
      background: #f2f6ff;
      padding: 18px;
      border-radius: 12px;
      overflow-wrap: anywhere;
      line-height: 1.7;
    }
    .copy-button {
      background: #1769e0;
      color: white;
      border: 0;
      padding: 12px 22px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <main class="detail-container">
    <a href="index.html">← Back to Home</a>
    <h1 id="photoTitle">Loading...</h1>
    <img id="photoImage" alt="AI Photo">
    <h2>AI Photo Prompt</h2>
    <div class="prompt-box" id="photoPrompt"></div>
    <button class="copy-button" id="copyButton">Copy Prompt</button>
    <p id="message"></p>
  </main>

  <script type="module">
    import { supabase } from './supabase.js';

    const id = new URLSearchParams(window.location.search).get('id');
    const title = document.getElementById('photoTitle');
    const image = document.getElementById('photoImage');
    const prompt = document.getElementById('photoPrompt');
    const message = document.getElementById('message');
    const copyButton = document.getElementById('copyButton');

    if (!id) {
      title.textContent = 'Photo not found';
    } else {
      const { data, error } = await supabase
        .from('ai_prompts')
        .select('*')
        .eq('id', id)
        .single();

      if (error || !data) {
        title.textContent = 'Photo not found';
        message.textContent = 'Please go back and try again.';
      } else {
        title.textContent = data.title;
        image.src = data.image_url;
        prompt.textContent = data.prompt;

        copyButton.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(data.prompt);
            message.textContent = 'Prompt copied successfully!';
          } catch {
            message.textContent = 'Copy failed. Please select and copy the prompt.';
          }
        });
      }
    }
  </script>
</body>
</html>
