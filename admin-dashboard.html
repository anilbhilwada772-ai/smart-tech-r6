
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Smart Tech R6</title>

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background: #f2f6ff;
      margin: 0;
      padding: 20px;
      color: #172033;
    }

    .dashboard {
      max-width: 900px;
      margin: 20px auto;
      background: white;
      padding: 22px;
      border-radius: 15px;
      box-shadow: 0 4px 15px #0001;
    }

    input, textarea, select, button {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 15px;
    }

    button {
      background: #1769e0;
      color: white;
      border: 0;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .delete-btn { background: #d93025; }
    .cancel-btn { background: #687386; }

    .item {
      border: 1px solid #ddd;
      padding: 15px;
      border-radius: 12px;
      margin: 15px 0;
    }

    .item img {
      width: 100%;
      max-height: 230px;
      object-fit: contain;
      border-radius: 8px;
      background: #f4f4f4;
    }

    #message {
      overflow-wrap: anywhere;
      font-weight: bold;
    }

    .error { color: #d93025; }
    .success { color: #16834a; }

    hr {
      margin: 30px 0;
      border: 0;
      border-top: 1px solid #ddd;
    }
  </style>
</head>

<body>

<main class="dashboard">

  <h1>Smart Tech R6</h1>
  <h2>Admin Dashboard</h2>

  <h3>Upload New AI Photo</h3>

  <form id="uploadForm">

    <input id="title" type="text"
      placeholder="Photo Title" required>

    <select id="category" required>
      <option value="">Select Photo Category</option>
      <option value="AI Photo Editing">AI Photo Editing</option>
      <option value="Couple Photos">Couple Photos</option>
      <option value="Boy Portrait">Boy Portrait</option>
      <option value="Girl Portrait">Girl Portrait</option>
      <option value="Festival Editing">Festival Editing</option>
      <option value="Trending AI Prompts">Trending AI Prompts</option>
      <option value="Other">Other</option>
    </select>

    <input id="photo" type="file"
      accept="image/jpeg,image/png,image/webp" required>

    <textarea id="prompt"
      placeholder="Write AI Photo Prompt"
      rows="7" required></textarea>

    <button type="submit">Upload Photo & Prompt</button>

  </form>

  <p id="message" role="status"></p>

  <hr>

  <h2>Manage Uploaded Photos</h2>

  <button id="refreshButton" type="button">
    Refresh Photos
  </button>

  <div id="photoList">Loading photos...</div>

  <hr>

  <h2>Publish New Blog</h2>

  <form id="blogForm">

    <input id="blogTitle" type="text"
      placeholder="Blog Title" required>

    <input id="blogDescription" type="text"
      placeholder="Short Blog Description">

    <select id="blogCategory" required>
      <option value="">Select Blog Category</option>
      <option value="AI Photo Editing">AI Photo Editing</option>
      <option value="AI Video Editing">AI Video Editing</option>
      <option value="AI Tools">AI Tools</option>
      <option value="Tutorials">Tutorials</option>
      <option value="Other">Other</option>
    </select>

    <input id="blogImage" type="file"
      accept="image/jpeg,image/png,image/webp">

    <textarea id="blogContent"
      placeholder="Write full blog article here..."
      rows="10" required></textarea>

    <button type="submit">Publish Blog</button>

  </form>

  <hr>

  <h2>Manage Published Blogs</h2>

  <button id="refreshBlogsButton" type="button">
    Refresh Blogs
  </button>

  <div id="blogList">Loading blogs...</div>

  <button id="logoutButton" type="button"
    class="cancel-btn">
    Logout
  </button>

</main>

<script type="module">

import { supabase } from './supabase.js';

const ADMIN_EMAIL = 'anilbhilwada772@gmail.com';

const message = document.getElementById('message');
const form = document.getElementById('uploadForm');
const photoList = document.getElementById('photoList');
const blogForm = document.getElementById('blogForm');
const blogList = document.getElementById('blogList');

const refreshButton = document.getElementById('refreshButton');
const refreshBlogsButton = document.getElementById('refreshBlogsButton');


// SHOW MESSAGE

function showMessage(text, type = '') {
  message.textContent = text;
  message.className = type;
}


// REQUEST TIMEOUT

function withTimeout(promise, seconds = 15) {

  let timer;

  const timeoutPromise = new Promise((resolve, reject) => {
    timer = setTimeout(() => {
      reject(new Error(
        'Request timed out. Internet connection or Supabase response check karein.'
      ));
    }, seconds * 1000);
  });

  return Promise.race([
    promise,
    timeoutPromise
  ]).finally(() => clearTimeout(timer));

}


// ADMIN LOGIN CHECK

async function initializeDashboard() {

  try {

    const { data, error } = await withTimeout(
      supabase.auth.getSession()
    );

    if (error) throw error;

    const session = data.session;

    if (
      !session ||
      session.user.email?.toLowerCase() !== ADMIN_EMAIL.toLowerCase()
    ) {
      window.location.replace('admin.html');
      return;
    }

    // Load both lists together
    await Promise.allSettled([
      loadPhotos(),
      loadBlogs()
    ]);

  } catch (error) {

    showMessage(
      'Dashboard error: ' + error.message,
      'error'
    );

    photoList.textContent = 'Dashboard could not load.';
    blogList.textContent = 'Dashboard could not load.';

  }

}


// IMAGE VALIDATION

function validImage(file) {

  return (
    ['image/jpeg', 'image/png', 'image/webp'].includes(file.type) &&
    file.size <= 5 * 1024 * 1024
  );

}


// IMAGE UPLOAD

async function uploadImage(file) {

  if (!validImage(file)) {
    throw new Error(
      'Image must be JPG, PNG or WEBP and smaller than 5 MB.'
    );
  }

  const filePath =
    crypto.randomUUID() + '-' + file.name;

  const { error } = await withTimeout(
    supabase.storage
      .from('ai-photos')
      .upload(filePath, file)
  );

  if (error) throw error;

  const { data } = supabase.storage
    .from('ai-photos')
    .getPublicUrl(filePath);

  return data.publicUrl;

}


// REMOVE OLD IMAGE

async function removeStoredImage(imageUrl) {

  if (!imageUrl) return;

  try {

    const marker =
      '/storage/v1/object/public/ai-photos/';

    const url = new URL(imageUrl);

    const position = url.pathname.indexOf(marker);

    if (position === -1) return;

    const path = decodeURIComponent(
      url.pathname.substring(position + marker.length)
    );

    const { error } = await withTimeout(
      supabase.storage
        .from('ai-photos')
        .remove([path])
    );

    if (error) {
      console.warn('Image cleanup failed:', error.message);
    }

  } catch (error) {
    console.warn('Image cleanup failed:', error.message);
  }

}


// LOAD PHOTOS

async function loadPhotos() {

  photoList.textContent = 'Loading photos...';
  refreshButton.disabled = true;

  try {

    const { data, error } = await withTimeout(
      supabase
        .from('ai_prompts')
        .select('*')
        .order('created_at', { ascending: false })
    );

    if (error) throw error;

    photoList.innerHTML = '';

    if (!data || data.length === 0) {
      photoList.textContent = 'No photos uploaded yet.';
      return;
    }

    data.forEach((item) => {

      const card = document.createElement('section');
      card.className = 'item';

      const img = document.createElement('img');
      img.src = item.image_url;
      img.alt = item.title || 'AI Photo';

      const heading = document.createElement('h3');
      heading.textContent = item.title || 'Untitled Photo';

      const editButton = document.createElement('button');
      editButton.textContent = 'Edit Photo & Prompt';

      const deleteButton = document.createElement('button');
      deleteButton.textContent = 'Delete Photo';
      deleteButton.className = 'delete-btn';

      card.append(
        img,
        heading,
        editButton,
        deleteButton
      );

      photoList.appendChild(card);

      editButton.addEventListener('click', () => {
        showEditForm(card, item);
      });

      deleteButton.addEventListener('click', async () => {

        if (!confirm(
          'Are you sure you want to delete this photo and prompt?'
        )) return;

        deleteButton.disabled = true;
        showMessage('Deleting photo...');

        try {

          const { error } = await withTimeout(
            supabase
              .from('ai_prompts')
              .delete()
              .eq('id', item.id)
          );

          if (error) throw error;

          await removeStoredImage(item.image_url);

          showMessage(
            'Photo and prompt deleted successfully!',
            'success'
          );

          await loadPhotos();

        } catch (error) {

          showMessage(
            'Delete failed: ' + error.message,
            'error'
          );

          deleteButton.disabled = false;

        }

      });

    });

  } catch (error) {

    photoList.textContent =
      'Photo loading failed: ' + error.message;

    showMessage(
      'Photo loading error: ' + error.message,
      'error'
    );

  } finally {

    refreshButton.disabled = false;

  }

}


// EDIT PHOTO

function showEditForm(card, item) {

  card.innerHTML = '';

  const heading = document.createElement('h3');
  heading.textContent = 'Edit Photo & Prompt';

  const titleInput = document.createElement('input');
  titleInput.value = item.title || '';
  titleInput.placeholder = 'Photo Title';

  const promptInput = document.createElement('textarea');
  promptInput.value = item.prompt || '';
  promptInput.rows = 7;
  promptInput.placeholder = 'Write AI Photo Prompt';

  const imageInput = document.createElement('input');
  imageInput.type = 'file';
  imageInput.accept = 'image/jpeg,image/png,image/webp';

  const saveButton = document.createElement('button');
  saveButton.textContent = 'Save Changes';

  const cancelButton = document.createElement('button');
  cancelButton.textContent = 'Cancel';
  cancelButton.className = 'cancel-btn';

  card.append(
    heading,
    titleInput,
    promptInput,
    imageInput,
    saveButton,
    cancelButton
  );

  cancelButton.addEventListener('click', loadPhotos);

  saveButton.addEventListener('click', async () => {

    const title = titleInput.value.trim();
    const prompt = promptInput.value.trim();
    const file = imageInput.files[0];

    if (!title || !prompt) {
      showMessage(
        'Title and prompt are required.',
        'error'
      );
      return;
    }

    saveButton.disabled = true;

    try {

      showMessage('Saving photo changes...');

      let imageUrl = item.image_url;

      if (file) {
        imageUrl = await uploadImage(file);
      }

      const { error } = await withTimeout(
        supabase
          .from('ai_prompts')
          .update({
            title,
            prompt,
            image_url: imageUrl
          })
          .eq('id', item.id)
      );

      if (error) throw error;

      if (file) {
        await removeStoredImage(item.image_url);
      }

      showMessage(
        'Photo and prompt updated successfully!',
        'success'
      );

      await loadPhotos();

    } catch (error) {

      showMessage(
        'Update failed: ' + error.message,
        'error'
      );

      saveButton.disabled = false;

    }

  });

}


// UPLOAD PHOTO

form.addEventListener('submit', async (event) => {

  event.preventDefault();

  const title =
    document.getElementById('title').value.trim();

  const category =
    document.getElementById('category').value;

  const prompt =
    document.getElementById('prompt').value.trim();

  const file =
    document.getElementById('photo').files[0];

  const submitButton = form.querySelector(
    'button[type="submit"]'
  );

  if (!file) return;

  submitButton.disabled = true;

  try {

    showMessage('Uploading photo...');

    const imageUrl = await uploadImage(file);

    const { error } = await withTimeout(
      supabase
        .from('ai_prompts')
        .insert([{
          title,
          category,
          image_url: imageUrl,
          prompt
        }])
    );

    if (error) throw error;

    showMessage(
      'Photo and prompt uploaded successfully!',
      'success'
    );

    form.reset();

    await loadPhotos();

  } catch (error) {

    showMessage(
      'Photo upload failed: ' + error.message,
      'error'
    );

  } finally {

    submitButton.disabled = false;

  }

});


// LOAD BLOGS

async function loadBlogs() {

  blogList.textContent = 'Loading blogs...';
  refreshBlogsButton.disabled = true;

  try {

    const { data, error } = await withTimeout(
      supabase
        .from('blog_posts')
        .select('*')
        .order('created_at', { ascending: false })
    );

    if (error) throw error;

    blogList.innerHTML = '';

    if (!data || data.length === 0) {
      blogList.textContent = 'No blogs published yet.';
      return;
    }

    data.forEach((item) => {

      const card = document.createElement('section');
      card.className = 'item';

      if (item.image_url) {

        const img = document.createElement('img');
        img.src = item.image_url;
        img.alt = item.title || 'Blog Image';

        card.appendChild(img);

      }

      const heading = document.createElement('h3');
      heading.textContent = item.title || 'Untitled Blog';

      const editButton = document.createElement('button');
      editButton.textContent = 'Edit Blog';

      const deleteButton = document.createElement('button');
      deleteButton.textContent = 'Delete Blog';
      deleteButton.className = 'delete-btn';

      card.append(
        heading,
        editButton,
        deleteButton
      );

      blogList.appendChild(card);

      editButton.addEventListener('click', () => {
        showBlogEditForm(card, item);
      });

      deleteButton.addEventListener('click', async () => {

        if (!confirm('Are you sure you want to delete this blog?')) {
          return;
        }

        deleteButton.disabled = true;
        showMessage('Deleting blog...');

        try {

          const { error } = await withTimeout(
            supabase
              .from('blog_posts')
              .delete()
              .eq('id', item.id)
          );

          if (error) throw error;

          await removeStoredImage(item.image_url);

          showMessage(
            'Blog deleted successfully!',
            'success'
          );

          await loadBlogs();

        } catch (error) {

          showMessage(
            'Blog delete failed: ' + error.message,
            'error'
          );

          deleteButton.disabled = false;

        }

      });

    });

  } catch (error) {

    blogList.textContent =
      'Blog loading failed: ' + error.message;

    showMessage(
      'Blog loading error: ' + error.message,
      'error'
    );

  } finally {

    refreshBlogsButton.disabled = false;

  }

}


// PUBLISH BLOG

blogForm.addEventListener('submit', async (event) => {

  event.preventDefault();

  const title =
    document.getElementById('blogTitle').value.trim();

  const description =
    document.getElementById('blogDescription').value.trim();

  const content =
    document.getElementById('blogContent').value.trim();

  const category =
    document.getElementById('blogCategory').value;

  const file =
    document.getElementById('blogImage').files[0];

  const submitButton = blogForm.querySelector(
    'button[type="submit"]'
  );

  submitButton.disabled = true;

  try {

    showMessage('Publishing blog...');

    let imageUrl = null;

    if (file) {
      imageUrl = await uploadImage(file);
    }

    const { error } = await withTimeout(
      supabase
        .from('blog_posts')
        .insert([{
          title,
          description,
          content,
          category,
          image_url: imageUrl
        }])
    );

    if (error) throw error;

    showMessage(
      'Blog published successfully!',
      'success'
    );

    blogForm.reset();

    await loadBlogs();

  } catch (error) {

    showMessage(
      'Blog publish failed: ' + error.message,
      'error'
    );

  } finally {

    submitButton.disabled = false;

  }

});


// EDIT BLOG

function showBlogEditForm(card, item) {

  card.innerHTML = '';

  const heading = document.createElement('h3');
  heading.textContent = 'Edit Blog';

  const titleInput = document.createElement('input');
  titleInput.value = item.title || '';
  titleInput.placeholder = 'Blog Title';

  const descriptionInput = document.createElement('input');
  descriptionInput.value = item.description || '';
  descriptionInput.placeholder = 'Short Blog Description';

  const categoryInput = document.createElement('select');

  [
    'AI Photo Editing',
    'AI Video Editing',
    'AI Tools',
    'Tutorials',
    'Other'
  ].forEach((value) => {

    const option = document.createElement('option');
    option.value = value;
    option.textContent = value;

    categoryInput.appendChild(option);

  });

  categoryInput.value = item.category || 'Other';

  const contentInput = document.createElement('textarea');
  contentInput.value = item.content || '';
  contentInput.rows = 10;
  contentInput.placeholder = 'Blog Article';

  const imageInput = document.createElement('input');
  imageInput.type = 'file';
  imageInput.accept = 'image/jpeg,image/png,image/webp';

  const saveButton = document.createElement('button');
  saveButton.textContent = 'Save Blog Changes';

  const cancelButton = document.createElement('button');
  cancelButton.textContent = 'Cancel';
  cancelButton.className = 'cancel-btn';

  card.append(
    heading,
    titleInput,
    descriptionInput,
    categoryInput,
    contentInput,
    imageInput,
    saveButton,
    cancelButton
  );

  cancelButton.addEventListener('click', loadBlogs);

  saveButton.addEventListener('click', async () => {

    const title = titleInput.value.trim();
    const description = descriptionInput.value.trim();
    const category = categoryInput.value;
    const content = contentInput.value.trim();
    const file = imageInput.files[0];

    if (!title || !content) {

      showMessage(
        'Blog title and content are required.',
        'error'
      );

      return;

    }

    saveButton.disabled = true;

    try {

      showMessage('Saving blog changes...');

      let imageUrl = item.image_url;

      if (file) {
        imageUrl = await uploadImage(file);
      }

      const { error } = await withTimeout(
        supabase
          .from('blog_posts')
          .update({
            title,
            description,
            category,
            content,
            image_url: imageUrl
          })
          .eq('id', item.id)
      );

      if (error) throw error;

      if (file) {
        await removeStoredImage(item.image_url);
      }

      showMessage(
        'Blog updated successfully!',
        'success'
      );

      await loadBlogs();

    } catch (error) {

      showMessage(
        'Blog update failed: ' + error.message,
        'error'
      );

      saveButton.disabled = false;

    }

  });

}


// REFRESH BUTTONS

refreshButton.addEventListener('click', loadPhotos);

refreshBlogsButton.addEventListener('click', loadBlogs);


// LOGOUT

document.getElementById('logoutButton')
  .addEventListener('click', async () => {

    try {

      await supabase.auth.signOut();

    } finally {

      window.location.href = 'admin.html';

    }

  });


// START DASHBOARD

initializeDashboard();

</script>

</body>
</html>
